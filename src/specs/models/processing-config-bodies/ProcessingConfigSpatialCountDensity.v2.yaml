title: Spatial Count Density
type: object
description: Processing config body for the Xenium count-density filter (OSTA imaging QC). Removes 3-MAD (nmads) low outliers on log(counts / cell area) and, when filterControls is set, cells with control probe + codeword counts above maxControlCounts. Keys are sample UUIDs, values are per-sample configurations.
additionalProperties:
  type: object
  properties:
    enabled:
      type: boolean
    auto:
      type: boolean
    filterSettings:
      type: object
      properties:
        nmads:
          type: number
        filterControls:
          type: boolean
        maxControlCounts:
          type: number
        binStep:
          type: number
    defaultFilterSettings:
      type: object
      properties:
        nmads:
          type: number
        filterControls:
          type: boolean
        maxControlCounts:
          type: number
        binStep:
          type: number
  required:
    - filterSettings
