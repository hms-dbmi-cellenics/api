title: Spatial UMI Outlier
type: object
description: Processing config body for the spatial (Visium HD, Xenium) UMI filter, by local outlier or absolute threshold (min/max UMIs, null = no bound). Keys are sample UUIDs, values are per-sample configurations.
additionalProperties:
  type: object
  properties:
    enabled:
      type: boolean
    auto:
      type: boolean
    filterSettings:
      type: object
      required:
        - method
        - methodSettings
      properties:
        method:
          type: string
          enum:
            - localOutlier
            - absoluteThreshold
        methodSettings:
          type: object
          properties:
            localOutlier:
              type: object
              properties:
                cutoff:
                  type: number
                binStep:
                  type: number
            absoluteThreshold:
              type: object
              properties:
                min:
                  type: number
                  nullable: true
                max:
                  type: number
                  nullable: true
                binStep:
                  type: number
    defaultFilterSettings:
      type: object
      required:
        - method
        - methodSettings
      properties:
        method:
          type: string
          enum:
            - localOutlier
            - absoluteThreshold
        methodSettings:
          type: object
          properties:
            localOutlier:
              type: object
              properties:
                cutoff:
                  type: number
                binStep:
                  type: number
            absoluteThreshold:
              type: object
              properties:
                min:
                  type: number
                  nullable: true
                max:
                  type: number
                  nullable: true
                binStep:
                  type: number
  required:
    - filterSettings
