title: Create sample file
description: 'Data required to create a new sample file'
type: object
properties:
  sampleFileId:
    type: string
  size:
    type: number
  uploadStatus:
    type: string
  overwriteExisting:
    type: boolean
  obj2sSampleId:
    type: string
    nullable: true
    description: 'Sample cell set an obj2s spatial file belongs to'
 
required:
  - sampleFileId
  - size

additionalProperties: false
